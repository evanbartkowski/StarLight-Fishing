<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Ocean Radial Glow -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Golden Hook Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="75%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Starlight Star Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" />
  
  <!-- Subtle Wave Arc -->
  <path d="M 6 36 Q 20 30 32 37 Q 44 44 58 35" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <path d="M 10 44 Q 24 38 34 43 Q 44 48 54 42" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" opacity="0.5" />

  <!-- Starlight Fishing Hook -->
  <!-- Hook eyelet at top -->
  <circle cx="28" cy="14" r="3.5" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <!-- Hook shank, bend, barb and point -->
  <path d="M 28 17.5 L 28 35 Q 28 47 39 47 Q 50 47 50 36 L 50 30 L 45 35" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Sparkling 4-Point Celestial Star -->
  <g transform="translate(18, 22)">
    <circle cx="0" cy="0" r="10" fill="url(#starGlow)" />
    <!-- 4-point star path -->
    <path d="M 0 -11 Q 0 0 11 0 Q 0 0 0 11 Q 0 0 -11 0 Q 0 0 0 -11 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="2.5" fill="#fef08a" />
  </g>

  <!-- Secondary Mini Star -->
  <g transform="translate(48, 17)">
    <circle cx="0" cy="0" r="5" fill="url(#starGlow)" />
    <path d="M 0 -6 Q 0 0 6 0 Q 0 0 0 6 Q 0 0 -6 0 Q 0 0 0 -6 Z" fill="#ffffff" />
  </g>
</svg>
